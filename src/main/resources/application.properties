# -------------------------
# App
# -------------------------
spring.application.name=signOn
spring.profiles.active=prod

# -------------------------
# Server
# -------------------------
server.port=8443

# HTTPS mandatory in prod
server.ssl.enabled=true
server.ssl.key-store=${SERVER_SSL_KEY_STORE}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Enforce modern TLS only
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Explicit cipher control
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,\
TLS_AES_128_GCM_SHA256,\
TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,\
TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# -------------------------
# Session security
# -------------------------
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# -------------------------
# Database (H2)
# -------------------------
spring.datasource.url=jdbc:h2:file:./data/signon
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

# -------------------------
# Logging
# -------------------------
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# -------------------------
# Thymeleaf
# -------------------------
spring.thymeleaf.cache=true
