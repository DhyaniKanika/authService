<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFA Verification</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-page">
    <div class="login-container">
        <h1 class="logo-text">MFA</h1>

        <form action="/mfa" method="POST">
            <div class="input-group">
                <label for="code">Enter MFA Code</label>
                <input type="text" id="code" name="code" placeholder="6-digit code" required>
            </div>

            <button type="submit" class="login-button">Verify</button>
        </form>
    </div>
</div>
</body>
</html>
