<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-page">
    <div class="login-container">
        <h1 class="logo-text">Change Password</h1>

        <p>You must change your password before continuing.</p>

        <form method="POST" action="/change-password" onsubmit="return validateForm()">
            <div class="input-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" required>
            </div>

            <p class="error-text" th:if="${error}" th:text="${error}"></p>

            <button type="submit" class="login-button">Update Password</button>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        </form>
    </div>
</div>

<script>
function validateForm() {
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("confirm").value;

    if (p1 !== p2) {
        alert("Passwords do not match");
        return false;
    }
    return true;
}
</script>
</body>
</html>
