<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-page">
    <div class="login-container">
        <h1 class="logo-text">Change Password</h1>

        <p>You must change your password before continuing.</p>

        <form method="POST" action="/change-password" onsubmit="return validateForm()">
            <div class="input-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" required>
            </div>

            <p class="error-text" th:if="${error}" th:text="${error}"></p>

            <button type="submit" class="login-button">Update Password</button>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        </form>
    </div>
</div>

<script src="/js/validation.js"></script>
<script src="/js/forms.js"></script>
<script src="/js/force-change-password.js"></script>


</body>
</html>
