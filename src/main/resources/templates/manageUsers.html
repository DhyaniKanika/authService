<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="login-page">
    <div class="login-container wide">
        <h1 class="logo-text">Manage Users</h1>

        <table class="user-table">
            <thead>
            <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th class="actions-col">Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.email}"></td>
                <td th:text="${user.role.name}"></td>

                <!-- Status -->
                <td>
                    <span th:text="${user.inactive ? 'INACTIVE' : (user.enabled ? 'ACTIVE' : 'DISABLED')}"></span>
                </td>

                <td>
                    <div class="table-actions">

                        <!-- Disable -->
                        <form th:if="${user.enabled and !user.inactive}"
                              th:action="@{/admin/disable-user}"
                              method="post">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button type="submit" class="login-button small">Disable</button>
                        </form>

                        <!-- Enable -->
                        <form th:if="${!user.enabled and !user.inactive}"
                              th:action="@{/admin/enable-user}"
                              method="post">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button type="submit" class="login-button small">Enable</button>
                        </form>

                        <!-- Inactivate -->
                        <form th:if="${!user.inactive}"
                              th:action="@{/admin/inactivate-user}"
                              method="post"
                              onsubmit="return confirm('Are you sure? This will permanently deactivate the user. This action cannot be undone.');">
                            <input type="hidden" name="userId" th:value="${user.id}">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}" />
                            <button type="submit" class="login-button danger small">
                                Set Inactive
                            </button>
                        </form>

                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="page-actions">
            <a href="/admin" class="login-button">Back to Admin</a>
            <a href="/logout" class="login-button subtle">Logout</a>
        </div>

    </div>
</div>

</body>
</html>
