<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-page">
    <div class="login-container">

        <h1 class="logo-text">My Account</h1>

        <!-- ================= User Info ================= -->
        <div class="account-info">
            <p><strong>Name:</strong> [[${name}]]</p>
            <p><strong>Email:</strong> [[${email}]]</p>
            <p><strong>Role:</strong> [[${role}]]</p>
        </div>

        <hr>

        <!-- ================= Change Password ================= -->
        <h3>Change Password</h3>

        <form action="/change-password" method="post" id="changePasswordForm">

            <div class="field">
                <label for="newPassword">New Password</label>
                <input type="password" name="password" id="newPassword" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required>
            </div>

            <small id="passwordError" class="error"></small>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button class="login-button" type="submit">
                Update Password
            </button>
        </form>

        <p class="error">[[${error}]]</p>
        <p class="success">[[${success}]]</p>

        <br>
        <a th:if="${role == 'ADMIN'}"
            href="/admin"
            class="login-button subtle">Back</a>

        <a th:if="${role != 'ADMIN'}"
            href="/landing"
            class="login-button subtle">Back</a>

    </div>
</div>

<!-- ================= Client Validation ================= -->
<script>
document.getElementById("changePasswordForm")
.addEventListener("submit", function(e) {

    const newPass = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    const err = document.getElementById("passwordError");

    err.textContent = "";

    if (newPass !== confirm) {
        err.textContent = "Passwords do not match.";
        e.preventDefault();
        return;
    }

    const regex = /^[A-Za-z0-9!@#$%^&*()_+=-]{8,64}$/;

if (!regex.test(newPass)) {
    err.textContent =
        "Password must be 8–64 characters and may include letters, numbers and !@#$%^&*()_+=-";
    e.preventDefault();
    return;
}
});
</script>


</body>
</html>
